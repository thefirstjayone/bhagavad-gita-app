<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bhagavad Gita - Sacred Study Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f6f1e5;
      --bg-card: rgba(255, 253, 248, 0.95);
      --bg-subtle: rgba(184, 148, 77, 0.08);
      --border-color: #dfd2b8;
      --border-highlight: #b8944d;
      --gold-primary: #8e6210;
      --gold-deep: #6e4a06;
      --gold-glow: rgba(184, 148, 77, 0.25);
      --text-main: #2d261e;
      --text-muted: #6e6456;
      --text-subtle: #8a7e6d;
      --saffron: #b84310;
      --maroon: #801a1a;
      --card-radius: 14px;
      --font-body: 'Lora', serif;
      --font-title: 'Cinzel', serif;
      --font-sanskrit: 'Yatra One', cursive;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(205, 175, 125, 0.35) 0%, transparent 75%),
        radial-gradient(circle at 100% 100%, rgba(184, 67, 16, 0.06) 0%, transparent 60%),
        radial-gradient(circle at 0% 100%, rgba(142, 98, 16, 0.08) 0%, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      background: rgba(250, 246, 237, 0.94);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 4px 15px rgba(110, 74, 6, 0.05);
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dfbe78, #b88b32);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #3d2605;
      box-shadow: 0 3px 10px rgba(184, 139, 50, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .brand-text h1 {
      font-family: var(--font-title);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--maroon);
    }
    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .nav-select-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #fbf7ee;
      border: 1px solid var(--border-highlight);
      border-radius: 30px;
      padding: 0.25rem 0.75rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    select {
      background: transparent;
      border: none;
      color: var(--gold-deep);
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      padding: 0.2rem 0.4rem;
    }
    select option { background: #fffcf6; color: #2d261e; }
    .btn {
      background: #fbf7ee;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 1rem;
      border-radius: 20px;
      font-family: var(--font-title);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }
    .btn:hover {
      border-color: var(--gold-primary);
      background: #fff;
      color: var(--gold-deep);
      transform: translateY(-1px);
    }
    .btn.active {
      background: linear-gradient(135deg, #b88b32, #8e6210);
      color: #fff;
      border-color: #8e6210;
      box-shadow: 0 3px 10px rgba(142, 98, 16, 0.3);
    }
    main {
      flex: 1;
      max-width: 950px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }
    .script-selector-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      background: rgba(243, 235, 219, 0.85);
      border: 1px solid var(--border-color);
      padding: 0.35rem;
      border-radius: 30px;
      width: fit-content;
      margin: 0 auto;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
    }
    .toggle-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.45rem 1.1rem;
      border-radius: 20px;
      font-family: var(--font-title);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-pill.active {
      background: #fff;
      color: var(--maroon);
      box-shadow: 0 2px 8px rgba(110, 74, 6, 0.12);
      border: 1px solid rgba(184, 148, 77, 0.25);
    }
    .hero-verse-card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(140, 110, 60, 0.08), inset 0 0 40px rgba(230, 215, 185, 0.25);
      position: relative;
    }
    .verse-badge {
      display: inline-block;
      font-family: var(--font-title);
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--maroon);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      border: 1px solid rgba(128, 26, 26, 0.25);
      padding: 0.3rem 1rem;
      border-radius: 20px;
      background: rgba(128, 26, 26, 0.04);
    }
    .sanskrit-display {
      font-family: var(--font-sanskrit);
      font-size: 2.1rem;
      line-height: 1.85;
      color: #1a140d;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
      margin-bottom: 1.2rem;
      white-space: pre-line;
    }
    .translit-display {
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--gold-primary);
      font-style: italic;
      margin-bottom: 1.8rem;
      letter-spacing: 0.02em;
      white-space: pre-line;
      font-weight: 500;
    }
    .audio-toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .section-title {
      font-family: var(--font-title);
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--maroon);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-highlight), transparent);
    }

    /* Distinct Shloka Line Section Separators */
    .shloka-line-section {
      background: rgba(255, 253, 248, 0.85);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 1.4rem;
      margin-bottom: 1.6rem;
      box-shadow: 0 4px 15px rgba(110, 74, 6, 0.04);
    }
    .shloka-line-banner {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding-bottom: 0.9rem;
      margin-bottom: 1.1rem;
      border-bottom: 1.5px dashed var(--border-color);
    }
    .shloka-line-title {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: var(--font-title);
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--maroon);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .shloka-line-badge {
      background: linear-gradient(135deg, #dfbe78, #b88b32);
      color: #3d2605;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.18rem 0.65rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 1px 4px rgba(110, 74, 6, 0.15);
    }
    .shloka-line-sanskrit-quote {
      font-family: var(--font-sanskrit);
      font-size: 1.25rem;
      color: #3a2e1e;
      background: rgba(184, 148, 77, 0.08);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      border-left: 3px solid var(--gold-primary);
      width: fit-content;
    }
    .shloka-line-translit-quote {
      font-size: 0.9rem;
      color: var(--gold-deep);
      font-style: italic;
      padding-left: 0.2rem;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.95rem;
    }
    .word-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      box-shadow: 0 3px 10px rgba(110, 74, 6, 0.03);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .word-card:hover {
      border-color: var(--border-highlight);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(110, 74, 6, 0.09);
    }
    .word-sanskrit {
      font-family: var(--font-sanskrit);
      font-size: 1.25rem;
      color: #1e170e;
      margin-bottom: 0.2rem;
    }
    .word-translit {
      font-size: 0.88rem;
      color: var(--gold-deep);
      font-style: italic;
      font-weight: 600;
      margin-bottom: 0.45rem;
    }
    .word-meaning {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.45;
      border-top: 1px dashed var(--border-color);
      padding-top: 0.45rem;
    }
    .translations-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.3rem;
    }
    @media (max-width: 768px) {
      .translations-container { grid-template-columns: 1fr; }
    }
    .trans-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      box-shadow: 0 4px 14px rgba(110, 74, 6, 0.04);
    }
    .trans-header {
      font-family: var(--font-title);
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--saffron);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .trans-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-main);
    }
    footer {
      border-top: 1px solid var(--border-color);
      padding: 1.6rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(246, 241, 229, 0.85);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">ॐ</div>
      <div class="brand-text">
        <h1>Bhagavad Gita</h1>
        <p>Sacred Study & Recitation Portal</p>
      </div>
    </div>

    <div class="header-controls">
      <div class="nav-select-group">
        <label for="chapterSelect" style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Ch</label>
        <select id="chapterSelect"></select>
        <label for="verseSelect" style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">V</label>
        <select id="verseSelect"></select>
      </div>

      <button id="tanpuraBtn" class="btn" onclick="toggleTanpura()">
        <span>🎵 Tanpura</span>
      </button>
    </div>
  </header>

  <main>
    <div class="script-selector-bar">
      <button class="toggle-pill active" onclick="setScript('devanagari', this)">Devanagari</button>
      <button class="toggle-pill" onclick="setScript('iast', this)">IAST (Academic)</button>
      <button class="toggle-pill" onclick="setScript('phonetic', this)">Easy English (aa/sh)</button>
    </div>

    <section class="hero-verse-card">
      <span class="verse-badge" id="verseBadge">Chapter 2 • Verse 13</span>
      <div class="sanskrit-display" id="mainSanskrit">...</div>
      <div class="translit-display" id="subTranslit">...</div>

      <div class="audio-toolbar">
        <button class="btn" onclick="chantCurrentVerse()">🔊 Recite Chanting</button>
        <button class="btn" onclick="prevVerse()">◀ Prev</button>
        <button class="btn" onclick="nextVerse()">Next ➔</button>
      </div>
    </section>

    <section>
      <div class="section-title">Word-for-Word Padachheda (Separated by Shloka Lines)</div>
      <!-- Line by line grouped containers -->
      <div id="wordLinesContainer"></div>
    </section>

    <section class="translations-container">
      <div class="trans-box">
        <div class="trans-header">1905 Classic (Annie Besant)</div>
        <div class="trans-text" id="trans1905">...</div>
      </div>
      <div class="trans-box">
        <div class="trans-header">Modern Direct English</div>
        <div class="trans-text" id="transModern">...</div>
      </div>
    </section>
  </main>

  <footer>
    The Sacred Song Divine • Public Domain 1905 Edition & Study Commentary
  </footer>

  <script>
    const CHAPTER_NAMES = [
      "1: Arjuna Vishada Yoga", "2: Sankhya Yoga", "3: Karma Yoga", "4: Jnana Karma Sanyasa",
      "5: Karma Sanyasa Yoga", "6: Dhyana Yoga", "7: Jnana Vijnana Yoga", "8: Akshara Brahma Yoga",
      "9: Raja Vidya Yoga", "10: Vibhuti Yoga", "11: Vishwarupa Darshana", "12: Bhakti Yoga",
      "13: Kshetra Kshetragjna", "14: Gunatraya Vibhaga", "15: Purushottama Yoga",
      "16: Daivasura Sampad", "17: Shraddhatraya Vibhaga", "18: Moksha Sanyasa Yoga"
    ];

    let currentChapter = 2;
    let currentVerseIndex = 0;
    let currentChapterData = [];
    let currentScript = 'devanagari';

    function initSelectors() {
      const chSel = document.getElementById('chapterSelect');
      chSel.innerHTML = CHAPTER_NAMES.map((name, i) => '<option value="' + (i + 1) + '" ' + (i + 1 === currentChapter ? 'selected' : '') + '>' + name + '</option>').join('');
      chSel.addEventListener('change', (e) => loadChapter(parseInt(e.target.value, 10)));
      document.getElementById('verseSelect').addEventListener('change', (e) => {
        currentVerseIndex = parseInt(e.target.value, 10);
        renderCurrentVerse();
      });
    }

    async function loadChapter(chNum) {
      currentChapter = chNum;
      try {
        const res = await fetch('./data/chapter_' + chNum + '.json');
        if (!res.ok) throw new Error('File not found');
        currentChapterData = await res.json();
      } catch (e) {
        console.warn('Could not load ./data/chapter_' + chNum + '.json', e);
        currentChapterData = [];
      }

      const vSel = document.getElementById('verseSelect');
      if (currentChapterData.length > 0) {
        vSel.innerHTML = currentChapterData.map((v, i) => '<option value="' + i + '">' + v.verse + '</option>').join('');
        const preferredIndex = currentChapterData.findIndex(v => v.verse === 13);
        currentVerseIndex = preferredIndex !== -1 ? preferredIndex : 0;
        vSel.value = currentVerseIndex;
        renderCurrentVerse();
      } else {
        vSel.innerHTML = '<option value="0">—</option>';
        clearDisplay();
      }
    }

    function setScript(mode, btn) {
      currentScript = mode;
      document.querySelectorAll('.toggle-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCurrentVerse();
    }

    function prevVerse() {
      if (currentVerseIndex > 0) {
        currentVerseIndex--;
        document.getElementById('verseSelect').value = currentVerseIndex;
        renderCurrentVerse();
      }
    }

    function nextVerse() {
      if (currentVerseIndex < currentChapterData.length - 1) {
        currentVerseIndex++;
        document.getElementById('verseSelect').value = currentVerseIndex;
        renderCurrentVerse();
      }
    }

    function renderCurrentVerse() {
      const v = currentChapterData[currentVerseIndex];
      if (!v) return;

      document.getElementById('verseBadge').innerText = 'Chapter ' + v.chapter + ' • Verse ' + v.verse;

      const sanskritEl = document.getElementById('mainSanskrit');
      const translitEl = document.getElementById('subTranslit');

      if (currentScript === 'devanagari') {
        sanskritEl.innerText = v.sanskrit;
        translitEl.innerText = v.iast;
      } else if (currentScript === 'iast') {
        sanskritEl.innerText = v.iast;
        translitEl.innerText = v.phonetic;
      } else {
        sanskritEl.innerText = v.phonetic;
        translitEl.innerText = v.sanskrit;
      }

      document.getElementById('trans1905').innerText = v.trans1905 || '—';
      document.getElementById('transModern').innerText = v.transModern || '—';

      // Parse individual Sanskrit & Transliteration lines
      const saLines = (v.sanskrit || '').split('\n').filter(l => l.trim().length > 0);
      const iaLines = (v.iast || '').split(/[|\n]/).map(l => l.trim()).filter(l => l.length > 0 && !/^\d+$/.test(l));

      const wrapper = document.getElementById('wordLinesContainer');
      wrapper.innerHTML = '';

      const words = v.words || [];
      const linesGrouped = {};

      // If explicit line numbers are provided on words, use them.
      // Otherwise, intelligently partition words between Line 1 and Line 2
      const hasExplicitLines = words.some(w => w.line !== undefined);
      if (hasExplicitLines) {
        words.forEach(w => {
          const lNum = w.line || 1;
          if (!linesGrouped[lNum]) linesGrouped[lNum] = [];
          linesGrouped[lNum].push(w);
        });
      } else {
        // Automatically split into Line 1 and Line 2 by half
        const midPoint = Math.ceil(words.length / 2);
        linesGrouped[1] = words.slice(0, midPoint);
        linesGrouped[2] = words.slice(midPoint);
      }

      const lineKeys = Object.keys(linesGrouped).sort((a,b) => parseInt(a)-parseInt(b));
      lineKeys.forEach(lKey => {
        const lineIdx = parseInt(lKey, 10);
        const section = document.createElement('div');
        section.className = 'shloka-line-section';

        const quoteSa = saLines[lineIdx - 1] || '';
        const quoteIa = iaLines[lineIdx - 1] || '';

        const banner = document.createElement('div');
        banner.className = 'shloka-line-banner';
        banner.innerHTML = `
          <div class="shloka-line-title">
            <span class="shloka-line-badge">Line ${lineIdx}</span>
            <span>${lineIdx === 1 ? 'First Half • Pūrvārdha' : 'Second Half • Uttarārdha'}</span>
          </div>
          ${quoteSa ? `<div class="shloka-line-sanskrit-quote">${quoteSa}</div>` : ''}
          ${quoteIa ? `<div class="shloka-line-translit-quote">${quoteIa}</div>` : ''}
        `;
        section.appendChild(banner);

        const grid = document.createElement('div');
        grid.className = 'word-grid';

        linesGrouped[lKey].forEach(w => {
          const card = document.createElement('div');
          card.className = 'word-card';
          card.innerHTML = `
            <div class="word-sanskrit">${currentScript === 'phonetic' ? w.ph : (currentScript === 'iast' ? w.iast : w.sa)}</div>
            <div class="word-translit">${currentScript === 'phonetic' ? w.iast : w.ph}</div>
            <div class="word-meaning">${w.m}</div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        wrapper.appendChild(section);
      });
    }

    function clearDisplay() {
      document.getElementById('mainSanskrit').innerText = 'No verses loaded for this chapter yet.';
      document.getElementById('subTranslit').innerText = 'Add data/chapter_' + currentChapter + '.json to GitHub repository.';
      document.getElementById('trans1905').innerText = '—';
      document.getElementById('transModern').innerText = '—';
      document.getElementById('wordLinesContainer').innerHTML = '';
    }

    function chantCurrentVerse() {
      window.speechSynthesis.cancel();
      const v = currentChapterData[currentVerseIndex];
      if (!v) return;
      const utter = new SpeechSynthesisUtterance(v.iast.replace(/[|॥\d]/g, ''));
      utter.rate = 0.85;
      utter.pitch = 0.95;
      window.speechSynthesis.speak(utter);
    }

    let audioCtx = null;
    let isDronePlaying = false;
    let droneOscs = [];

    function toggleTanpura() {
      const btn = document.getElementById('tanpuraBtn');
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (isDronePlaying) {
        droneOscs.forEach(o => { try { o.stop(); } catch(e){} });
        droneOscs = [];
        isDronePlaying = false;
        btn.classList.remove('active');
        btn.querySelector('span').innerText = '🎵 Tanpura';
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const freqs = [138.59, 207.65, 277.18, 277.60];
        freqs.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = idx === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);

          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();
          lfo.frequency.setValueAtTime(0.2 + idx * 0.1, audioCtx.currentTime);
          lfoGain.gain.setValueAtTime(0.005, audioCtx.currentTime);
          lfo.connect(gain.gain);
          lfo.start();

          gain.gain.setValueAtTime(0.04 / (idx + 1), audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          droneOscs.push(osc, lfo);
        });
        isDronePlaying = true;
        btn.classList.add('active');
        btn.querySelector('span').innerText = '🔊 Playing Tanpura';
      }
    }

    initSelectors();
    loadChapter(2);
  </script>
</body>
</html>
